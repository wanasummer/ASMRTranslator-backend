schema_version: 1
protocol: common-tts/1
id: example-common-tts
config_key: exampleCommonTts
name: 通用 TTS 开发模板
version: 0.1.0
output: wav
capabilities:
  execution: segment
  voices: true
  rate: false
  pitch: false
  text_policy: preserve
  required_assets: [source_speech]
execution:
  max_concurrent: 1
  timeout_seconds: 1800
  max_upload_bytes: 67108864
logs:
  mode: poll
parameters:
  type: object
  additionalProperties: false
  properties:
    voice_source:
      type: string
      title: 音色来源
      enum: [segment, reference, voice_id]
      default: segment
    voice_id:
      type: string
      title: 音色
      default: ''
      x-source: voices
      x-visible-when: {voice_source: voice_id}
    reference_audio:
      type: string
      title: 音色参考音频
      default: ''
      x-control: audio-file
      x-audio-editor: true
      x-role: voice_reference
      x-visible-when: {voice_source: reference}
    emotion_mode:
      type: string
      title: 情感模式
      enum: [same, segment, reference, vector, text]
      default: segment
      x-segment-override: true
    emotion_reference:
      type: string
      title: 情感参考音频
      default: ''
      x-control: audio-file
      x-audio-editor: true
      x-role: emotion_reference
      x-visible-when: {emotion_mode: reference}
    emotion_vector:
      type: array
      title: 情感向量
      items: {type: number, minimum: 0, maximum: 1}
      minItems: 8
      maxItems: 8
      default: [0, 0, 0, 0, 0, 0, 0, 0]
      x-visible-when: {emotion_mode: vector}
    emotion_text:
      type: string
      title: 情感描述
      default: ''
      x-control: textarea
      x-visible-when: {emotion_mode: text}
    emotion_weight:
      type: number
      title: 情感权重
      minimum: 0
      maximum: 1
      default: 0.65
      x-segment-override: true
    duration_factor:
      type: number
      title: 时长系数
      minimum: 0.5
      maximum: 2
      default: 1
    sampling:
      type: object
      title: 采样参数
      additionalProperties: false
      default: {}
      properties:
        do_sample: {type: boolean, title: 随机采样, default: true}
        temperature: {type: number, title: 温度, minimum: 0.1, maximum: 2, default: 0.8}
        top_p: {type: number, minimum: 0, maximum: 1, default: 0.8}
        top_k: {type: integer, minimum: 0, maximum: 100, default: 30}
        num_beams: {type: integer, minimum: 1, maximum: 10, default: 3}
        repetition_penalty: {type: number, minimum: 0.1, maximum: 20, default: 10}
        max_mel_tokens: {type: integer, minimum: 50, default: 1500}
  allOf:
    - if: {properties: {voice_source: {const: reference}}, required: [voice_source]}
      then: {properties: {reference_audio: {minLength: 1}}, required: [reference_audio]}
    - if: {properties: {emotion_mode: {const: reference}}, required: [emotion_mode]}
      then: {properties: {emotion_reference: {minLength: 1}}, required: [emotion_reference]}
